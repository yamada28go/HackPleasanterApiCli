name: Dotnet Tests

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj

      - name: Restore
        run: dotnet restore HackPleasanterApi.sln

      - name: Verify formatting
        run: dotnet format HackPleasanterApi.sln --verify-no-changes --no-restore

      - name: Test
        run: dotnet test HackPleasanterApi.sln --configuration Release --no-restore -m:1 -nodeReuse:false
